<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img"
     aria-label="Fine-tuned large language model reached 73 percent sensitivity and 91 percent specificity for early-onset colorectal cancer, across 1,953 patients from 30 US health systems, ages 18 to 44.">
  <rect width="640" height="360" fill="#F3F2ED"/>

  <!-- eyebrow -->
  <text x="32" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="1.1" fill="#5A6270">EARLY-ONSET COLORECTAL CANCER</text>
  <text x="32" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="1.1" fill="#8C9099">FINE-TUNED LLM · RETROSPECTIVE COHORT</text>

  <line x1="32" y1="96" x2="608" y2="96" stroke="#E4E3DD" stroke-width="1"/>

  <!-- row 1: sensitivity -->
  <text x="32" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14" fill="#5A6270">Sensitivity</text>
  <rect x="150" y="132" width="390" height="14" rx="4" fill="#E1DFD8"/>
  <path d="M150 132 H431 A4 4 0 0 1 435 136 V142 A4 4 0 0 1 431 146 H150 Z" fill="#2B4ACB"/>
  <text x="608" y="149" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#14161A">73%</text>

  <!-- row 2: specificity -->
  <text x="32" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14" fill="#5A6270">Specificity</text>
  <rect x="150" y="192" width="390" height="14" rx="4" fill="#E1DFD8"/>
  <path d="M150 192 H501 A4 4 0 0 1 505 196 V202 A4 4 0 0 1 501 206 H150 Z" fill="#2B4ACB"/>
  <text x="608" y="209" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#14161A">91%</text>

  <!-- scale endpoints, recessive -->
  <text x="150" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#A9ADB4">0</text>
  <text x="540" y="232" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#A9ADB4">100</text>

  <line x1="32" y1="280" x2="608" y2="280" stroke="#E4E3DD" stroke-width="1"/>
  <text x="32" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11.5" letter-spacing="0.4" fill="#5A6270">1,953 PATIENTS · 30 US HEALTH SYSTEMS · AGES 18–44</text>
  <text x="32" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11.5" letter-spacing="0.4" fill="#8C9099">ASCO 2025 · AMIA 2025</text>
</svg>
