<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img"
     aria-label="A generative patient journey foundation model reached 0.89 to 0.98 specificity across four cancer types on 1.42 million patient records, with negative predictive value 0.85 to 0.94. ISPOR 2026.">
