<text x="32" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#8C9099">PATIENT JOURNEY FOUNDATION MODEL · NO LABELS</text>
