# ─────────────────────────────────────────────────────────────────────────────
# ADDING A PUBLICATION: copy a block, edit the fields, done.
#   year  — the printed/citation year. Also drives the left rail.
#   date  — sort key only (newest first within a group).
#   authors — plain text. Your own name is bolded automatically
#             ("Kim, Y." in proceedings and abstracts, "Kim, Y. W." elsewhere).
#   area    — which section the entry appears in (sections render in this order):
#             ai = AI, machine learning & statistics / edpsych = Education & psychology.
#   kind    — publication type. Printed as a label on each entry, and sets order
#             within a section, strongest first (order lives in _templates/pubs.ejs):
#             Peer-reviewed articles / Peer-reviewed conference proceedings /
#             Preprints / Working papers / Published conference abstracts.
# Optional:
#   status     — printed after the venue, e.g. "In press" for accepted work.
#   link_label — text for the url link (default: "DOI" for doi.org links, else "Link").
# ─────────────────────────────────────────────────────────────────────────────

